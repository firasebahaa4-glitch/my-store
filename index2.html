<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accessories_ZM - أكسسوارات آيفون</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; }
        .loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; flex-direction: column;
        }
        .loader {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 12px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .share-link {
            background: #10b981;
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            display: flex;
            align-items: center;
            padding-top: 80px;
        }
        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .hero-content h1 {
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            color: white;
            margin-bottom: 20px;
        }
        .highlight {
            background: linear-gradient(135deg, #f5af19, #f12711);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .feature {
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .products {
            padding: 80px 0;
            background: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .product-card:hover { transform: translateY(-10px); }
        .product-media {
            height: 220px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .product-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .product-info { padding: 15px; }
        .product-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 5px; }
        .product-price { font-size: 1.3rem; font-weight: 800; color: #667eea; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 30px;
            max-width: 450px;
            width: 100%;
            padding: 25px;
            position: relative;
        }
        .close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1rem;
        }
        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .detail-content {
            background: white;
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .detail-gallery { padding: 20px; background: #f5f5f5; }
        .detail-main-img {
            width: 100%;
            height: 260px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .detail-main-img img { width: 100%; height: 100%; object-fit: contain; }
        .detail-thumbnails {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 0;
        }
        .detail-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }
        .detail-thumb.active { border-color: #667eea; }
        .detail-info { padding: 20px; }
        .detail-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
        .detail-desc { color: #666; margin-bottom: 15px; }
        .detail-price { font-size: 1.8rem; font-weight: 800; color: #667eea; margin-bottom: 20px; }
        .close-detail {
            position: sticky;
            top: 15px;
            right: 15px;
            float: right;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
        }
        .admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.97);
            z-index: 5000;
            padding: 20px;
            overflow-y: auto;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 25px;
        }
        .admin-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: #667eea; }
        .orders-list { max-height: 400px; overflow-y: auto; }
        .order-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            border-right: 4px solid #f59e0b;
        }
        .order-item.delivered { border-right-color: #10b981; }
        .order-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .images-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .preview-img img { width: 100%; height: 100%; object-fit: cover; }
        .remove-img {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="loading" id="loading"><div class="loader"></div><p>✨ جاري التحميل ✨</p></div>
<header><div class="header-content"><div class="logo"><i class="fas fa-mobile-alt"></i>ACCESSORIES_ZM</div><div class="share-link" onclick="shareStore()"><i class="fas fa-share-alt"></i> مشاركة</div></div></header>
<section class="hero"><div class="hero-content"><h1>أفضل <span class="highlight">أكسسوارات</span><br>آيفون في الجزائر</h1><div class="features"><div class="feature"><i class="fas fa-truck-fast"></i>توصيل 24h</div><div class="feature"><i class="fas fa-shield-alt"></i>ضمان الجودة</div><div class="feature"><i class="fas fa-hand-holding-usd"></i>دفع عند الاستلام</div></div></div></section>
<section class="products"><div class="container"><h2 class="section-title">منتجاتنا المختارة</h2><div class="products-grid" id="productsGrid"></div></div></section>
<script>
const defaultProducts = [
    { id: 1, title: "سماعة AirPods Pro", price: 12500, description: "سماعة أصلية عالية الجودة، عزل ضوضاء، شحن لاسلكي", images: ["https://img.icons8.com/color/240/airpods-pro.png"] },
    { id: 2, title: "شاحن MagSafe", price: 4800, description: "شاحن مغناطيسي بقوة 15 واط، شحن سريع", images: ["https://img.icons8.com/color/240/magsafe-charger.png"] },
    { id: 3, title: "غطاء حماية شفاف", price: 1200, description: "غطاء سيليكون شفاف، حماية من الصدمات", images: ["https://img.icons8.com/color/240/iphone-case.png"] },
    { id: 4, title: "كابل USB-C سريع", price: 800, description: "كابل شحن سريع بطول 2 متر", images: ["https://img.icons8.com/color/240/usb-c-cable.png"] }
];
let products = [], orders = [], adminPassword = "admin123", currentProduct = null, tempImages = [];
function loadData() {
    const saved = localStorage.getItem('products');
    if (saved && JSON.parse(saved).length > 0) products = JSON.parse(saved);
    else { products = [...defaultProducts]; localStorage.setItem('products', JSON.stringify(products)); }
    const savedOrders = localStorage.getItem('orders');
    if (savedOrders) orders = JSON.parse(savedOrders);
    renderProducts(); updateStats();
}
function saveProducts() { localStorage.setItem('products', JSON.stringify(products)); renderProducts(); }
function saveOrders() { localStorage.setItem('orders', JSON.stringify(orders)); updateStats(); }
function validatePhone(p) { return /^0[0-9]{9}$/.test(p); }
function updateStats() {
    const delivered = orders.filter(o => o.status === 'delivered');
    const revenue = delivered.reduce((s, o) => s + (o.price || 0), 0);
    if(document.getElementById('totalRevenue')) document.getElementById('totalRevenue').innerHTML = (revenue || 0).toLocaleString() + ' د.ج';
    if(document.getElementById('totalOrders')) document.getElementById('totalOrders').innerHTML = orders.length;
    if(document.getElementById('deliveredCount')) document.getElementById('deliveredCount').innerHTML = delivered.length;
    if(document.getElementById('returnedCount')) document.getElementById('returnedCount').innerHTML = orders.filter(o => o.status === 'returned').length;
}
function renderProducts() {
    const grid = document.getElementById('productsGrid');
    if (!products || products.length === 0) { grid.innerHTML = '<div style="text-align:center;padding:50px;">لا توجد منتجات</div>'; return; }
    grid.innerHTML = products.map(p => `<div class="product-card" onclick="openDetail(${p.id})"><div class="product-media"><img src="${p.images && p.images[0] ? p.images[0] : 'https://via.placeholder.com/300x220/667eea/white?text=Product'}" alt="${p.title}"><div class="product-badge">جديد</div></div><div class="product-info"><h3 class="product-title">${p.title}</h3><div class="product-price">${p.price.toLocaleString()} د.ج</div></div></div>`).join('');
}
function openDetail(id) {
    currentProduct = products.find(p => p.id === id);
    if(!currentProduct) return;
    document.getElementById('detailTitle').innerHTML = currentProduct.title;
    document.getElementById('detailDesc').innerHTML = currentProduct.description;
    document.getElementById('detailPrice').innerHTML = currentProduct.price.toLocaleString() + ' د.ج';
    const images = currentProduct.images || [];
    document.getElementById('mainImg').src = images[0] || 'https://via.placeholder.com/300x260/667eea/white?text=Product';
    document.getElementById('detailModal').style.display = 'flex';
}
function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
function openOrderFromDetail() { closeDetailModal(); setTimeout(() => openOrderModal(currentProduct.id), 100); }
let currentOrderId = null;
function openOrderModal(id) { currentOrderId = id; document.getElementById('orderModal').style.display = 'flex'; }
function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }
document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const phone = document.getElementById('phone').value;
    if(!validatePhone(phone)) { document.getElementById('phoneError').style.display = 'block'; return; }
    const product = products.find(p => p.id === currentOrderId);
    if(!product) return;
    orders.unshift({ id: Date.now(), productId: product.id, productTitle: product.title, price: product.price, customerName: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value, phone: phone, date: new Date().toISOString(), status: 'pending' });
    saveOrders();
    alert('✅ تم تسجيل الطلب بنجاح!');
    document.getElementById('orderForm').reset();
    closeOrderModal();
});
function openPasswordModal() { document.getElementById('passwordModal').style.display = 'flex'; }
function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }
function checkAdminPassword() {
    if(document.getElementById('adminPasswordInput').value === adminPassword) {
        closePasswordModal();
        document.getElementById('adminPanel').style.display = 'flex';
        renderAdminProducts(); renderOrders(); updateStats();
    } else { document.getElementById('passwordError').style.display = 'block'; }
}
document.addEventListener('keydown', function(e) { if(e.ctrlKey && e.shiftKey && e.key === 'A') { e.preventDefault(); openPasswordModal(); } });
function renderAdminProducts() {
    const container = document.getElementById('adminProductsList');
    if(!products.length) { container.innerHTML = '<p style="text-align:center;padding:20px;">لا توجد منتجات</p>'; return; }
    container.innerHTML = products.map(p => `<div style="display:flex;justify-content:space-between;align-items:center;background:white;padding:12px;margin-bottom:8px;border-radius:12px;"><div><strong>${p.title}</strong><br><small>${p.price.toLocaleString()} د.ج</small></div><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑️ حذف</button></div>`).join('');
}
function renderOrders() {
    const container = document.getElementById('ordersList');
    if(!orders.length) { container.innerHTML = '<p style="text-align:center;padding:20px;">لا توجد طلبات</p>'; return; }
    container.innerHTML = orders.map(o => `<div class="order-item ${o.status}"><div>👤 ${o.customerName}<br>📦 ${o.productTitle}<br>💰 ${o.price.toLocaleString()} د.ج<br>📞 ${o.phone}</div><div class="order-buttons">${o.status !== 'delivered' ? `<button class="btn btn-success btn-sm" onclick="markDelivered(${o.id})">✓ تم التسليم</button>` : ''}${o.status !== 'returned' && o.status !== 'delivered' ? `<button class="btn btn-danger btn-sm" onclick="markReturned(${o.id})">↺ لم يتم</button>` : ''}</div></div>`).join('');
}
function markDelivered(id) { const o = orders.find(o => o.id === id); if(o && o.status !== 'delivered') { o.status = 'delivered'; saveOrders(); renderOrders(); updateStats(); alert('✅ تم تأكيد التسليم'); } }
function markReturned(id) { const o = orders.find(o => o.id === id); if(o && o.status !== 'returned' && o.status !== 'delivered') { o.status = 'returned'; saveOrders(); renderOrders(); updateStats(); alert('↺ تم تسجيل كطلب عائد'); } }
function deleteProduct(id) { if(confirm('هل أنت متأكد؟')) { products = products.filter(p => p.id !== id); saveProducts(); renderAdminProducts(); updateStats(); } }
function previewImages(input) {
    const container = document.getElementById('imagesPreview');
    container.innerHTML = ''; tempImages = [];
    Array.from(input.files).forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            tempImages.push(e.target.result);
            const div = document.createElement('div');
            div.className = 'preview-img';
            div.innerHTML = `<img src="${e.target.result}"><div class="remove-img" onclick="this.parentElement.remove(); tempImages.splice(${idx},1)">×</div>`;
            container.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}
document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    if(tempImages.length === 0) { alert('⚠️ الرجاء اختيار صورة'); return; }
    products.unshift({ id: Date.now(), title: document.getElementById('productTitle').value, price: parseFloat(document.getElementById('productPrice').value), description: document.getElementById('productDesc').value, images: [...tempImages] });
    saveProducts();
    this.reset();
    document.getElementById('imagesPreview').innerHTML = '';
    tempImages = [];
    renderAdminProducts();
    alert('✅ تم إضافة المنتج');
});
function changePassword() {
    const newPass = document.getElementById('newPassword').value;
    if(newPass.length < 4) { alert('⚠️ 4 أحرف على الأقل'); return; }
    adminPassword = newPass;
    localStorage.setItem('adminPassword', adminPassword);
    alert('✅ تم تغيير كلمة السر');
    document.getElementById('newPassword').value = '';
}
function closeAdminPanel() { document.getElementById('adminPanel').style.display = 'none'; }
function shareStore() {
    const url = window.location.href;
    if(navigator.share) navigator.share({ title: 'accessories_ZM', url: url });
    else navigator.clipboard.writeText(url).then(() => alert('✅ تم نسخ الرابط'));
}
function createModals() {
    let d = document.createElement('div'); d.className = 'detail-modal'; d.id = 'detailModal';
    d.innerHTML = `<div class="detail-content"><div class="close-detail" onclick="closeDetailModal()">✕</div><div class="detail-gallery"><div class="detail-main-img"><img id="mainImg" src=""></div></div><div class="detail-info"><h2 class="detail-title" id="detailTitle"></h2><p class="detail-desc" id="detailDesc"></p><div class="detail-price" id="detailPrice"></div><button class="buy-btn" onclick="openOrderFromDetail()">🛒 اشتري الآن</button></div></div>`;
    document.body.appendChild(d);
    let o = document.createElement('div'); o.className = 'modal'; o.id = 'orderModal';
    o.innerHTML = `<div class="modal-content"><div class="close" onclick="closeOrderModal()">&times;</div><h2 style="text-align:center">📋 إتمام الطلب</h2><form id="orderForm"><div class="form-group"><label>الاسم الأول</label><input type="text" id="firstName" required></div><div class="form-group"><label>اللقب</label><input type="text" id="lastName" required></div><div class="form-group"><label>رقم الهاتف</label><input type="tel" id="phone" placeholder="05XXXXXXXX" required><div class="phone-error" id="phoneError">⚠️ رقم غير صحيح</div></div><button type="submit" class="buy-btn">تأكيد الطلب</button></form></div>`;
    document.body.appendChild(o);
    let p = document.createElement('div'); p.className = 'modal'; p.id = 'passwordModal';
    p.innerHTML = `<div class="modal-content" style="text-align:center"><div class="close" onclick="closePasswordModal()">&times;</div><i class="fas fa-lock" style="font-size:50px;margin-bottom:15px;color:#667eea;"></i><h3>🔐 لوحة التحكم</h3><input type="password" id="adminPasswordInput" style="width:100%;padding:12px;margin:15px 0;border-radius:15px;border:2px solid #ddd;"><div class="phone-error" id="passwordError">❌ كلمة سر خاطئة</div><button class="buy-btn" onclick="checkAdminPassword()">تأكيد</button></div>`;
    document.body.appendChild(p);
    let a = document.createElement('div'); a.className = 'admin-panel'; a.id = 'adminPanel';
